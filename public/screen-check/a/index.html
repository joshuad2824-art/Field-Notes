<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#142a2b"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Screen A">
<title>Screen A · Field Notes</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="../check.css"></head>
<body data-test="A"><div id="root"><header><h1>Screen A · Current setting</h1></header>
<main><p id="mode" class="small"></p><p>Look for a gap below the brass strip. Try typing, dismiss the keyboard, then turn the phone sideways and back.</p>
<label for="typing">Keyboard check — temporary test text</label><textarea id="typing" placeholder="Type a few words"></textarea><button id="dismiss">Dismiss keyboard</button>
<pre id="report"></pre><button id="copy">Copy screen report</button><p id="copy-status" role="status"></p>
<p class="small">This test does not read or save your notes. Keep your existing Field Notes icon.</p></main><footer>Bottom edge of the test page</footer></div><script src="../check.js"></script></body></html>
